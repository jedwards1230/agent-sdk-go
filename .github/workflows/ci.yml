# CI: fast build/vet/test + lint on every PR; the race detector runs on push
# (merges to main and release tags) and on any PR into OR out of a `milestone/*`
# or `integration/*` integration branch.
#
# The PR-time exception exists because an integration branch accumulates many
# pieces before anything reaches main, so "a data race blocks the release" is too
# late a gate: by then the racy commit is buried under a dozen others and the
# person who wrote it has moved on. Milestone rounds are also where genuinely
# concurrent code lands (mutex-guarded registries, connection managers with async
# connect and backoff), which is exactly what -race exists to check.
#
# Deliberately NOT enabled for every PR: routine PRs keep the fast lane, which is
# the original trade-off. If a future round finds that too narrow, widen this to
# all pull_request events rather than reintroducing per-piece manual race runs —
# a gate that depends on a human remembering is not a gate.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11

  bench:
    # Deliberately UNCONDITIONAL. Both halves of this job guard invariants that
    # break silently — an allocation regression looks like a passing test, and
    # an application import looks like a passing build — so gating them behind
    # a branch predicate would mean the PR that introduces the breakage is
    # exactly the PR that skips the check. The `race` job's comment above is
    # the record of what a naming-based allowlist costs; this job declines to
    # repeat it.
    #
    # It is cheap: the benchmarks run at a fixed 100 iterations, five times,
    # over the whole module (BENCH_PKGS, default ./...) — but only the
    # benchmark names listed in scripts/bench-baseline.txt are gated. An
    # unlisted benchmark is run and reported, never able to fail this job.
    # Seconds, not minutes; see the wall-time note in docs/TESTING.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # shellcheck ships on the ubuntu runner image. The scripts below are the
      # gate, so they get linted before they are trusted to enforce anything.
      - run: shellcheck scripts/*.sh
      - run: ./scripts/check-independence.sh
      - run: ./scripts/bench.sh --check
      # The gate's own logic, replayed against committed synthetic inputs.
      # Without this, a broken comparison reports a cheerful OK forever — and
      # every one of these cases was a real hole found in review, not a
      # hypothetical.
      #
      # Exit codes are asserted EXACTLY. A `!` negation would accept 2
      # ("bench.sh could not run") as if it were 1 ("bench.sh found a
      # regression"), passing a gate that is merely broken as a gate that works.
      - name: the gate must fail on regressed, blinded, and unusable inputs
        run: |
          set -uo pipefail
          # <expected exit>|<args>
          cases=(
            # 1 = a violation was detected and reported
            "1|--input scripts/testdata/regression-bytes-only.txt"
            "1|--input scripts/testdata/missing-benchmark.txt"
            "1|--input scripts/testdata/improvement-collapse.txt"
            "1|--baseline scripts/testdata/baselines/zero-metrics.txt --input scripts/testdata/regression-bytes-only.txt"
            # 2 = the baseline is unusable; refuse rather than pass vacuously
            "2|--baseline scripts/testdata/baselines/malformed.txt --input scripts/testdata/regression-bytes-only.txt"
            # The one that actually got through before validation existed:
            # "500x" coerces to 500 with no crash, so a -99.6% collapse was
            # reported as "improved" and the gate exited 0.
            "2|--baseline scripts/testdata/baselines/numeric-looking.txt --input scripts/testdata/regression-bytes-only.txt"
            "2|--baseline scripts/testdata/baselines/no-rows.txt --input scripts/testdata/regression-bytes-only.txt"
            "2|--baseline scripts/testdata/baselines/unmatched-rows.txt --input scripts/testdata/regression-bytes-only.txt"
            # 0 = a benchmark can be in the RUN set without being in the GATE
            # set (#148): present-but-unbaselined must be reported as
            # "ignored" and stay green, never fail the gate.
            #
            # Pinned to its own baseline, NOT scripts/bench-baseline.txt: this
            # case asserts gate SEMANTICS, so coupling it to the live baseline
            # made every future re-baseline break it (which is exactly what
            # happened when session/ rows landed).
            "0|--baseline scripts/testdata/baselines/six-benchguard-rows.txt --input scripts/testdata/ok-with-ignored.txt"
          )
          fails=0
          for entry in "${cases[@]}"; do
            want="${entry%%|*}"
            args="${entry#*|}"
            status=0
            # shellcheck disable=SC2086 # args is a deliberately word-split flag list
            ./scripts/bench.sh --check $args >/dev/null 2>&1 || status=$?
            if [ "$status" -ne "$want" ]; then
              echo "::error::bench.sh --check $args: expected exit $want, got $status"
              fails=$((fails + 1))
            else
              echo "ok (exit $status): bench.sh --check $args"
            fi
          done
          [ "$fails" -eq 0 ]
      # The run set (BENCH_PKGS) must never silently collapse to zero
      # packages — that would make bench.sh "pass" having run nothing, the
      # same class of vacuous-green bug the --check matrix above locks for
      # the gate set. A whitespace-only override word-splits to an empty
      # array; bench.sh must die (exit 2) before it ever shells out to `go
      # test`, so this case is free even though it isn't an --input run.
      - name: the run set must not collapse to zero packages
        run: |
          set -uo pipefail
          status=0
          BENCH_PKGS=' ' ./scripts/bench.sh --check >/dev/null 2>&1 || status=$?
          if [ "$status" -ne 2 ]; then
            echo "::error::BENCH_PKGS=' ': expected exit 2 (no packages to run), got $status"
            exit 1
          fi
          echo "ok (exit 2): BENCH_PKGS=' ' resolves to zero packages"
      # check-independence.sh must be precise in BOTH directions: it has to fire
      # on the consuming application's module path and stay quiet on an
      # unrelated module that merely contains the string "gofer". A gate that
      # cries wolf on someone else's dependency gets switched off.
      - name: the independence check must be precise in both directions
        run: |
          set -uo pipefail
          sdk=github.com/jedwards1230/agent-sdk-go/loop
          fails=0
          assert() { # <expected exit> <dep line>
            local want="$1" dep="$2" status=0
            printf '%s\n%s\n' "$sdk" "$dep" | ./scripts/check-independence.sh --stdin >/dev/null 2>&1 || status=$?
            if [ "$status" -ne "$want" ]; then
              echo "::error::check-independence.sh on '$dep': expected exit $want, got $status"
              fails=$((fails + 1))
            else
              echo "ok (exit $status): $dep"
            fi
          }
          assert 1 github.com/jedwards1230/gofer
          assert 1 github.com/jedwards1230/gofer/internal/daemon
          assert 1 github.com/jedwards1230/gofer.test
          assert 0 github.com/unrelated/gofergo
          assert 0 github.com/someone/gofer-utils
          # An empty or implausible list must refuse, not pass vacuously.
          status=0
          printf '' | ./scripts/check-independence.sh --stdin >/dev/null 2>&1 || status=$?
          [ "$status" -eq 2 ] || { echo "::error::empty stdin: expected exit 2, got $status"; fails=$((fails + 1)); }
          [ "$fails" -eq 0 ]

  race:
    # Both integration-branch prefixes in use. `milestone/*` came first (M5,
    # M7); `integration/contract-hardening` is the same topology under a
    # different name, and matching only the first prefix silently dropped the
    # gate for that whole round — the failure this predicate exists to prevent,
    # produced by the predicate itself. If a third prefix ever appears, widen
    # to all pull_request events rather than adding a third startsWith: an
    # allowlist that depends on naming a branch correctly is the same class of
    # gate this file's header warns about.
    #
    # head_ref as well as base_ref, because an integration round has TWO kinds
    # of PR and the base_ref conditions only cover one. A per-piece PR targets
    # the integration branch (base_ref matches). The tracking PR is the
    # integration branch itself targeting main — base_ref is `main`, so it
    # matched nothing and skipped, leaving the round's COMBINED state
    # ungated at PR time. That is the worse of the two gaps: per-piece PRs are
    # each small, while the tracking PR is where a dozen of them first exist
    # together, and `push` only re-checks after it has already merged.
    if: >-
      github.event_name == 'push' ||
      startsWith(github.base_ref, 'milestone/') ||
      startsWith(github.base_ref, 'integration/') ||
      startsWith(github.head_ref, 'milestone/') ||
      startsWith(github.head_ref, 'integration/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go test -race ./...
